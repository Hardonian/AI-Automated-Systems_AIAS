name: Static Quality Snapshot

on:
  schedule:
    - cron: "40 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  systems-metrics:
    name: Capture deterministic quality snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 8.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify static release candidate
        run: pnpm verify

      - name: Collect static output metrics
        run: pnpm collect:static-metrics systems/static-quality.json

      - name: Upload quality snapshot
        uses: actions/upload-artifact@v4
        with:
          name: static-quality-snapshot
          path: systems/static-quality.json
          retention-days: 90
