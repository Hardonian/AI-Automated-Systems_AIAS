name: CI / Visual Regression & UI Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      update_baselines:
        description: 'Update visual regression baselines'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20'
  PNPM_VERSION: "8.15.9"
  BASE_URL: 'http://localhost:3000'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # QUALITY GATES
  # ============================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

  # ============================================
  # BUILD
  # ============================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          # Skip DB operations during build if not available
          SKIP_DB: 'true'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: .next/
          retention-days: 1

  # ============================================
  # UNIT TESTS
  # ============================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test -- --run

  # ============================================
  # PLAYWRIGHT FUNCTIONAL TESTS
  # ============================================
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: .next/

      - name: Run E2E tests (non-visual)
        run: pnpm test:e2e --project=chromium --project=firefox --project=webkit
        env:
          CI: 'true'
          BASE_URL: ${{ env.BASE_URL }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ============================================
  # VISUAL REGRESSION TESTS
  # ============================================
  test-visual:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: .next/

      - name: Start production server
        run: |
          pnpm start &
          npx wait-on ${{ env.BASE_URL }} --timeout 60000
        env:
          PORT: '3000'

      - name: Run visual regression tests
        run: |
          if [ "${{ github.event.inputs.update_baselines }}" == "true" ]; then
            pnpm test:visual:update
          else
            pnpm test:visual
          fi
        env:
          CI: 'true'
          BASE_URL: ${{ env.BASE_URL }}

      - name: Upload visual test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-test-results
          path: |
            playwright-report/
            test-results/
            tests/e2e/__screenshots__/
          retention-days: 14

      - name: Comment on PR with visual results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## 🔍 Visual Regression Test Results

            ❌ **Visual tests failed**

            Please check the uploaded artifacts for screenshot diffs.

            To update baselines locally:
            \`\`\`bash
            pnpm test:visual:update
            \`\`\`

            [View Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # ============================================
  # UI CONSISTENCY AUDIT
  # ============================================
  test-audit:
    name: UI Consistency Audit
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: .next/

      - name: Start production server
        run: |
          pnpm start &
          npx wait-on ${{ env.BASE_URL }} --timeout 60000
        env:
          PORT: '3000'

      - name: Run UI consistency audit
        run: pnpm test:audit
        env:
          CI: 'true'
          BASE_URL: ${{ env.BASE_URL }}

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-audit-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ============================================
  # ACCESSIBILITY TESTS
  # ============================================
  test-a11y:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output
          path: .next/

      - name: Start production server
        run: |
          pnpm start &
          npx wait-on ${{ env.BASE_URL }} --timeout 60000
        env:
          PORT: '3000'

      - name: Run accessibility tests
        run: pnpm test:e2e --grep @accessibility
        env:
          CI: 'true'
          BASE_URL: ${{ env.BASE_URL }}

      - name: Upload accessibility results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ============================================
  # SUMMARY
  # ============================================
  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test-e2e, test-visual, test-audit, test-a11y]
    if: always()
    steps:
      - name: Test Results Summary
        run: |
          echo "========================================"
          echo "TEST RUN SUMMARY"
          echo "========================================"
          echo "E2E Tests: ${{ needs.test-e2e.result }}"
          echo "Visual Regression: ${{ needs.test-visual.result }}"
          echo "UI Audit: ${{ needs.test-audit.result }}"
          echo "Accessibility: ${{ needs.test-a11y.result }}"
          echo "========================================"

      - name: Fail if any tests failed
        if: |
          needs.test-e2e.result == 'failure' ||
          needs.test-visual.result == 'failure' ||
          needs.test-audit.result == 'failure' ||
          needs.test-a11y.result == 'failure'
        run: |
          echo "❌ Some tests failed. Check the job outputs above for details."
          exit 1
