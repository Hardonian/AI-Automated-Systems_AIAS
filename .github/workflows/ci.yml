name: CI
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint + Typecheck + Build + Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Full verification suite
        run: pnpm verify

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Semgrep security scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/ci
            p/secrets
            p/audit-trail
            p/command-injection
            p/path-traversal
            p/weak-crypto
            p/sql-injection
            p/xss

  reproducibility:
    name: Reproducible Build Hash
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install & build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Generate build hash
        run: |
          find out -type f -name "*.html" -o -name "*.js" -o -name "*.css" 2>/dev/null | sort | head -20 | xargs sha256sum > build-hash.txt || echo "no output" > build-hash.txt

      - uses: actions/upload-artifact@v7
        with:
          name: build-hash
          path: build-hash.txt
