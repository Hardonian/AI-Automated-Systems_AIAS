name: Weekly Static Build Metrics

on:
  schedule:
    - cron: "20 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    name: Build and record static metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 8.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build

      - name: Collect build metrics
        run: pnpm collect:static-metrics bench/results/latest.json

      - name: Enforce JavaScript budget
        run: pnpm check:bundle-size

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: static-build-metrics
          path: bench/results/latest.json
          retention-days: 90
