name: Static Environment Guard

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".env.example"
      - ".env.production"
      - "lib/env.ts"
      - "scripts/doctor.ts"
      - ".github/workflows/env-sync.yml"

permissions:
  contents: read

jobs:
  static-environment-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 8.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate optional environment handling
        run: pnpm doctor

      - name: Enforce static-first architecture
        run: pnpm check:static-first
