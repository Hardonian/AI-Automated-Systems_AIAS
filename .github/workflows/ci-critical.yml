name: Critical Quality Gates

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: '22'
  PNPM_VERSION: "8.15.9".15.9"
  PNPM_VERSION: "8.15.9".15.9'

concurrency:
  group: critical-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-critical:
    name: Lint Critical Paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint:critical

  test-critical:
    name: Critical Tests
    runs-on: ubuntu-latest
    needs: [lint-critical]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:critical

  deployment-guard:
    name: Deployment Guard
    runs-on: ubuntu-latest
    needs: [test-critical]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deploy:guard
