name: Future Runtime Compatibility Check

on:
  push:
    branches: [main, develop]
  # Removed PR trigger - compatibility checks moved to scheduled workflow
  # pull_request:
  #   branches: [main, develop]
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  futurecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          cd apps/web && pnpm install --frozen-lockfile

      - name: Run Future Runtime Check
        run: |
          npx tsx scripts/futurecheck.ts

      - name: Generate Future Check Report
        run: |
          npx tsx scripts/futurecheck.ts --output=json > futurecheck-report.json

      - name: Upload future check artifacts
        uses: actions/upload-artifact@v7
        with:
          name: futurecheck-report-${{ github.run_number }}
          path: futurecheck-report.json

      - name: Comment on PR with compatibility status
        if: github.event_name == 'pull_request'
        run: |
          npx tsx scripts/post-futurecheck-comment.ts ${{ github.event.pull_request.number }}

      - name: Create compatibility issue if needed
        if: failure()
        run: |
          npx tsx scripts/create-compatibility-issue.ts

      - name: Update compatibility badge
        run: |
          npx tsx scripts/update-compatibility-badge.ts
