packages:
  - '.'

overrides:
  react: $react
  react-dom: $react-dom
  '@types/react': $@types/react
  '@types/react-dom': $@types/react-dom
  '@babel/core': ^7.28.6
  '@playwright/test': ^1.60.0
  playwright: ^1.60.0
  form-data: '>=2.5.4'
  semver: '>=5.7.2'
  axios: '>=0.30.2'
  ioredis: 5.9.2
  qs: ^6.14.1
  pdfjs-dist: '>=4.2.67'
  robots-txt-guard: '>=1.0.2'
  lodash.set: npm:@types/lodash.set@latest
  tar: '>=7.5.7'
  bl: '>=0.9.5'
  got: '>=11.8.5'
  nanoid: '>=3.3.8'
  lodash: '>=4.17.23'
  undici: '>=7.18.2'
  esbuild: '>=0.25.0'
  ai: '>=5.0.52'
  tough-cookie: '>=4.1.3'
  cookie: '>=0.7.0'
  tmp: '>=0.2.4'
  uuid@<11.1.1: '>=11.1.1'
  sharp@<0.35.0: '>=0.35.0'

peerDependencyRules:
  ignoreMissing:
    - react
    - react-dom
    - '@types/react'
    - '@types/react-dom'
  allowedVersions:
    react: '19'
    react-dom: '19'
    '@types/react': '19'
    '@types/react-dom': '19'
