name: Static Quality Sweep

on:
  schedule:
    - cron: "5 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.js"
      - "**.jsx"
      - "**.css"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  quality-sweep:
    name: Verify static release contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 8.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify static release candidate
        run: pnpm verify

      - name: Publish quality summary
        run: |
          echo "## Static Quality Sweep" >> $GITHUB_STEP_SUMMARY
          echo "- Static-first contract: verified" >> $GITHUB_STEP_SUMMARY
          echo "- Build, content, schema, link, and security checks: verified" >> $GITHUB_STEP_SUMMARY
