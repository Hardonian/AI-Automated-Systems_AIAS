name: Refresh visual baselines

# Maintenance workflow: regenerate committed Playwright visual baselines in the
# exact CI environment, then open a PR with the new screenshots for human review.
# Trigger manually: gh workflow run refresh-visual-baselines.yml --ref main

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build static export (served by Playwright webServer)
        run: pnpm build
      - name: Update snapshots against current build
        run: pnpm test:visual --update-snapshots
      - name: Re-verify with updated baselines
        run: pnpm test:visual
      - name: Open baseline PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- tests/e2e/__screenshots__; then
            echo "No baseline changes; aborting quietly."
            exit 0
          fi
          BRANCH="chore/visual-baselines-$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add tests/e2e/__screenshots__
          git commit -m "chore(e2e): refresh visual baselines from CI (generated by refresh workflow)"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(e2e): refresh visual regression baselines" \
            --body "Regenerated in the CI container by the refresh-visual-baselines workflow and re-verified green in the same run. Review the screenshot diff before merging."
