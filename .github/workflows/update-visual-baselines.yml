name: Update Visual Regression Baselines

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to update baselines on"
        required: true
        default: "main"
        type: string
      reason:
        description: "Reason for baseline update"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  NODE_VERSION: "22"
  PNPM_VERSION: "8"
  BASE_URL: "http://localhost:3000"

concurrency:
  group: visual-baseline-update
  cancel-in-progress: false

jobs:
  update-baselines:
    name: Update Visual Baselines
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build application
        run: pnpm build
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
          NODE_OPTIONS: "--max-old-space-size=4096"
          SKIP_DB: "true"

      - name: Start production server
        run: |
          pnpm start &
          npx wait-on ${{ env.BASE_URL }} --timeout 60000
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
          PORT: "3000"

      - name: Update visual baselines
        run: pnpm test:visual:update
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
          CI: "true"
          BASE_URL: ${{ env.BASE_URL }}

      - name: Check for baseline changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain tests/e2e/__screenshots__/ 2>/dev/null)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create PR with updated baselines
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="chore/update-visual-baselines-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          git add tests/e2e/__screenshots__/
          git commit -m "chore: update visual regression baselines

          Reason: ${{ github.event.inputs.reason }}

          - Triggered by: ${{ github.actor }}
          - Workflow: ${{ github.run_id }}"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --title "chore: update visual regression baselines" \
            --body "📸 Visual regression baselines updated.

            **Reason:** ${{ github.event.inputs.reason }}
            **Triggered by:** @${{ github.actor }}
            **Target Branch:** ${{ github.event.inputs.branch }}" \
            --base "${{ github.event.inputs.branch }}" \
            --label "auto/visual-baselines"

      - name: No changes summary
        if: steps.check_changes.outputs.has_changes == 'false'
        run: |
          echo "ℹ️ No visual baseline changes detected. Screenshots match current baselines."

      - name: Upload new baselines
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: updated-visual-baselines
          path: tests/e2e/__screenshots__/
          retention-days: 30
